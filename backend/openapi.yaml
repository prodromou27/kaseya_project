  /api/v1/customers/{customer_pk}/audit-events/:
    get:
      operationId: customers_audit_events_list
      description: |-
        Nested ``/customers/{customer_pk}/...`` views: resolve the customer from the DB and require a capability.

        The customer always comes from the URL + database + policy, never from request bodies.
      parameters:
      - in: path
        name: customer_pk
        schema:
          type: string
        required: true
      - name: page
        required: false
        in: query
