          type: string
        required: true
      - in: query
        name: from
        schema:
          type: string
        description: Older generation ID
      - in: query
        name: to
        schema:
          type: string
      tags:
      - customers
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
