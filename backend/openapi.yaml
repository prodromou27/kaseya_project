        Nested ``/customers/{customer_pk}/...`` views: resolve the customer from the DB and require a capability.

        The customer always comes from the URL + database + policy, never from request bodies.
      parameters:
      - in: path
        name: customer_pk
        schema:
          type: string
        required: true
      - in: query
        name: from
        schema:
          type: string
        description: Older generation ID
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - agent_installed
          - agent_version
          - device_added
          - device_removed
          - group
          - hostname
          - ip_addresses
          - os
          - site
          - software
      - in: query
        name: q
        schema:
          type: string
      - in: query
        name: to
        schema:
          type: string
      tags:
      - customers
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
