openapi: 3.0.3
info:
  title: Odyssey Kaseya Analytics & Reporting Portal API
  version: 0.3.0
paths:
  /api/v1/assets/{id}/:
    get:
      operationId: assets_retrieve
      description: '``/assets/{id}/``: customer resolved from the asset row, then
        authorised.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this asset.
        required: true
      tags:
      - assets
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/audit-events/:
    get:
      operationId: audit_events_list
      description: System-wide audit log (super admin / system.audit.read).
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - audit-events
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditEventList'
          description: ''
  /api/v1/auth/config/:
    get:
      operationId: auth_config_retrieve
      description: 'Public: which login methods are enabled. Also issues the CSRF
        cookie for the SPA.'
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: Local password login — bootstrap/dev only (SECURITY.md §2). CSRF-protected
        and rate limited.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      security:
      - sessionAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/me/:
