components:
  schemas:
    Alias:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        product:
          type: string
          format: uuid
        name_pattern:
          type: string
          maxLength: 255
        publisher_pattern:
          type: string
          description: Exact publisher; blank = any.
          maxLength: 255
        match_type:
          $ref: '#/components/schemas/MatchTypeEnum'
        review_status:
          allOf:
          - $ref: '#/components/schemas/ReviewStatusEnum'
          readOnly: true
        created_by:
          type: string
          format: email
          readOnly: true
        reviewed_by:
          type: string
          format: email
          readOnly: true
        reviewed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - created_by
      - id
      - name_pattern
      - product
      - review_status
      - reviewed_at
      - reviewed_by
    ArchitectureEnum:
      enum:
      - any
      - x64
      - x86
      - arm64
      type: string
      description: |-
        * `any` - Any / not architecture-specific
        * `x64` - x64
        * `x86` - x86
        * `arm64` - ARM64
    AssetRow:
      type: object
      properties:
        id:
          type: string
          format: uuid
        external_id:
          type: string
        hostname:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 255
        device_type:
          type: string
          maxLength: 64
        group_name:
          type: string
          maxLength: 255
        site_external_id:
          type: string
          maxLength: 64
        site_name:
          type: string
          maxLength: 255
        group_external_id:
          type: string
          description: Blank = not in the device list.
          maxLength: 64
        organization_external_id:
          type: string
          maxLength: 64
        client_version:
          type: string
          maxLength: 64
        last_seen_online:
          type: string
          format: date-time
          nullable: true
        last_seen_stale:
          type: boolean
          nullable: true
          readOnly: true
        os_name:
          type: string
          maxLength: 255
        os_version:
          type: string
          maxLength: 64
        manufacturer:
          type: string
          maxLength: 255
        model:
          type: string
          maxLength: 255
        serial_number:
          type: string
          maxLength: 255
        domain:
          type: string
          maxLength: 255
        tags: {}
        software_status:
          $ref: '#/components/schemas/SoftwareStatusEnum'
        software_count:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        active:
          type: boolean
        source:
          type: string
        data_basis:
          type: string
        generation_id:
          type: string
          format: uuid
        as_of:
          type: string
          format: date-time
      required:
      - active
      - as_of
      - data_basis
      - external_id
      - generation_id
      - id
      - last_seen_stale
      - organization_external_id
      - software_status
      - source
    AuditEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        actor_label:
          type: string
          readOnly: true
          description: Actor email/system name at event time.
        action:
          type: string
          readOnly: true
        customer:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        customer_code:
          type: string
          readOnly: true
        target_type:
          type: string
          readOnly: true
        target_id:
          type: string
          readOnly: true
        outcome:
          allOf:
          - $ref: '#/components/schemas/OutcomeEnum'
          readOnly: true
        request_id:
          type: string
          readOnly: true
        metadata:
          readOnly: true
      required:
      - action
      - actor_label
      - created_at
      - customer
      - customer_code
      - id
      - metadata
      - outcome
      - request_id
      - target_id
      - target_type
    AuthSourceEnum:
      enum:
      - local
      - oidc
      type: string
      description: |-
        * `local` - Local (bootstrap/dev only)
        * `oidc` - OIDC (Microsoft Entra ID)
    Customer:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          maxLength: 32
        name:
          type: string
          maxLength: 200
        status:
          $ref: '#/components/schemas/CustomerStatusEnum'
        data_region:
          type: string
          description: Approved data residency region.
          maxLength: 64
        restricted_data:
          type: boolean
          description: 'Restricted/government data: ingestion requires a separately
            approved deployment (SECURITY.md §6).'
        notes:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        my_capabilities:
          type: array
          items:
            type: string
          readOnly: true
      required:
      - code
      - created_at
      - id
      - my_capabilities
      - name
      - updated_at
    CustomerStatusEnum:
      enum:
      - onboarding
      - active
      - suspended
      - archived
      type: string
      description: |-
        * `onboarding` - Onboarding
        * `active` - Active
        * `suspended` - Suspended
        * `archived` - Archived
    DeviceOsUpdate:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        asset_id:
          type: string
          format: uuid
        hostname:
          type: string
        state:
          $ref: '#/components/schemas/DeviceOsUpdateStateEnum'
        kb_article:
          type: string
        title:
          type: string
        update_id:
          type: string
        revision_number:
          type: integer
        severity:
          type: string
          maxLength: 32
        category:
          type: string
          maxLength: 64
        cvss_score:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,1})?$
          nullable: true
        cve_codes: {}
        release_date:
          type: string
        installed_at_raw:
          type: string
          description: Vendor value verbatim; documented without timezone.
          maxLength: 40
        installed_by_agent:
          type: boolean
          nullable: true
        installed_status:
          type: string
        installed_collected_at:
          type: string
          format: date-time
      required:
      - asset_id
      - hostname
      - id
      - installed_collected_at
      - installed_status
      - kb_article
      - release_date
      - revision_number
      - state
      - title
      - update_id
    DeviceOsUpdateStateEnum:
      enum:
      - available
      - installed
      type: string
      description: |-
        * `available` - Available (not installed)
        * `installed` - Installed
    DevicePatchStatus:
      type: object
      properties:
        asset_id:
          type: string
          format: uuid
        hostname:
          type: string
        device_type:
          type: string
        os_name:
          type: string
        last_seen_online:
          type: string
          format: date-time
        update_counts:
          nullable: true
          description: Source 'Updates' object; null if absent.
        available_status:
          $ref: '#/components/schemas/UpdateStatusEnum'
        available_count:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        installed_status:
          $ref: '#/components/schemas/UpdateStatusEnum'
        installed_count:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        installed_collected_at:
          type: string
          format: date-time
          nullable: true
        collected_at:
          type: string
          format: date-time
      required:
      - asset_id
      - available_status
      - collected_at
      - device_type
      - hostname
      - installed_status
      - last_seen_online
      - os_name
    Exception:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        product:
          type: string
          format: uuid
        product_label:
          type: string
          readOnly: true
        asset:
          type: string
          format: uuid
          nullable: true
        reason:
          type: string
        approved_by:
          type: string
          format: email
          readOnly: true
        approved_at:
          type: string
          format: date-time
          readOnly: true
        expires_at:
          type: string
          format: date-time
        status:
          allOf:
          - $ref: '#/components/schemas/ExceptionStatusEnum'
          readOnly: true
        revoked_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - approved_at
      - approved_by
      - expires_at
      - id
      - product
      - product_label
      - reason
      - revoked_at
      - status
    ExceptionStatusEnum:
      enum:
      - active
      - revoked
      type: string
      description: |-
        * `active` - Active
        * `revoked` - Revoked
    FormatEnum:
      enum:
      - csv
      - xlsx
      - pdf
      type: string
      description: |-
        * `csv` - csv
        * `xlsx` - xlsx
        * `pdf` - pdf
    FrequencyEnum:
      enum:
      - daily
      - weekly
      - monthly
      type: string
      description: |-
        * `daily` - Daily
        * `weekly` - Weekly
        * `monthly` - Monthly
    Import:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        state:
          allOf:
          - $ref: '#/components/schemas/ImportStateEnum'
          readOnly: true
        rows: {}
        preview:
          readOnly: true
        created_by:
          type: string
          format: email
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        reviewed_by:
          type: string
          format: email
          readOnly: true
        reviewed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        review_note:
          type: string
          readOnly: true
      required:
      - created_at
      - created_by
      - id
      - preview
      - review_note
      - reviewed_at
      - reviewed_by
      - rows
      - state
    ImportStateEnum:
      enum:
      - pending
      - approved
      - rejected
      type: string
      description: |-
        * `pending` - Pending review
        * `approved` - Approved
        * `rejected` - Rejected
    IntegrationInstance:
      type: object
      description: '``credential_ref`` is write-only: responses only say whether one
        is configured.'
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 120
        provider:
          $ref: '#/components/schemas/ProviderEnum'
        base_url:
          type: string
          maxLength: 500
        region:
          type: string
          maxLength: 32
        credential_ref:
          type: string
          writeOnly: true
          maxLength: 200
        credential_configured:
          type: boolean
          readOnly: true
        enabled:
          type: boolean
        installed_updates_budget:
          type: integer
          maximum: 3000
          minimum: 0
          description: Max per-device GET /api/v3/assets/:id calls per sync for InstalledUpdates
            (0 = disabled). Documented limit is 3600 requests/hour per token+endpoint.
        verify_tls:
          type: boolean
          readOnly: true
        max_rps:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        status:
          allOf:
          - $ref: '#/components/schemas/IntegrationInstanceStatusEnum'
          readOnly: true
        is_fixture:
          type: boolean
          description: True for demo/fixture-backed instances. Never mixed with live
            data.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - base_url
      - created_at
      - credential_configured
      - id
      - name
      - provider
      - status
      - updated_at
      - verify_tls
    IntegrationInstanceStatusEnum:
      enum:
      - idle
      - queued
      - running
      - partial
      - failed
      - completed
      - disabled
      type: string
      description: |-
        * `idle` - Idle
        * `queued` - Queued
        * `running` - Running
        * `partial` - Partial
        * `failed` - Failed
        * `completed` - Completed
        * `disabled` - Disabled
    IntegrationRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 120
        provider:
          $ref: '#/components/schemas/ProviderEnum'
        is_fixture:
          type: boolean
          description: True for demo/fixture-backed instances. Never mixed with live
            data.
      required:
      - id
      - name
      - provider
    Login:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          writeOnly: true
          maxLength: 256
      required:
      - email
      - password
    MappingStatusEnum:
      enum:
      - proposed
      - approved
      - rejected
      - revoked
      type: string
      description: |-
        * `proposed` - Proposed (not trusted)
        * `approved` - Approved
        * `rejected` - Rejected
        * `revoked` - Revoked
    MatchTypeEnum:
      enum:
      - exact
      - prefix
      type: string
      description: |-
        * `exact` - Exact (case-insensitive)
        * `prefix` - Prefix (case-insensitive)
    Membership:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user:
