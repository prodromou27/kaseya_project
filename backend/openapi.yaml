    IntegrationInstance:
      type: object
      description: '``credential_ref`` is write-only: responses only say whether one
        is configured.'
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 120
        provider:
          $ref: '#/components/schemas/ProviderEnum'
        base_url:
          type: string
          maxLength: 500
        region:
          type: string
          maxLength: 32
        credential_ref:
          type: string
          writeOnly: true
          maxLength: 200
        credential_configured:
          type: boolean
          readOnly: true
        credential_source:
          type: string
          description: '``portal`` (entered in the portal, encrypted), ``server``
            (env/file reference) or ``none``.'
          readOnly: true
        credential_set_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        credential_set_by:
          type: string
          nullable: true
          readOnly: true
        enabled:
          type: boolean
        installed_updates_budget:
          type: integer
          maximum: 3000
          minimum: 0
          description: Max per-device GET /api/v3/assets/:id calls per sync for InstalledUpdates
            (0 = disabled). Documented limit is 3600 requests/hour per token+endpoint.
        applied_policies_budget:
          type: integer
          maximum: 3000
          minimum: 0
          description: Max per-device GET /api/v3/devices/:id/appliedpolicies calls
            per sync (0 = disabled). Documented limit is 3600 requests/hour.
        notifications_budget:
          type: integer
          maximum: 3000
          minimum: 0
          description: Max per-device GET /api/v3/devices/:id/notifications calls
            per sync (0 = disabled).
        custom_fields_budget:
          type: integer
          maximum: 3000
          minimum: 0
          description: Max per-device GET /api/v3/devices/:id/customfields calls per
            sync (0 = disabled). Used only for customers with approved custom field
            names.
        last_test_at:
          type: string
          format: date-time
          nullable: true
        last_test_outcome:
          type: string
          maxLength: 32
        last_test_result: {}
        verify_tls:
          type: boolean
          readOnly: true
        max_rps:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        status:
          allOf:
          - $ref: '#/components/schemas/IntegrationInstanceStatusEnum'
          readOnly: true
        is_fixture:
          type: boolean
          description: True for demo/fixture-backed instances. Never mixed with live
            data.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - base_url
      - created_at
      - credential_configured
      - credential_set_at
      - credential_set_by
      - credential_source
      - id
      - name
      - provider
      - status
      - updated_at
      - verify_tls
