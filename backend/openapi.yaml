components:
  schemas:
    AuditEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        actor_label:
          type: string
          readOnly: true
          description: Actor email/system name at event time.
        action:
          type: string
          readOnly: true
        customer:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        customer_code:
          type: string
          readOnly: true
        target_type:
          type: string
          readOnly: true
        target_id:
          type: string
          readOnly: true
        outcome:
          allOf:
          - $ref: '#/components/schemas/OutcomeEnum'
          readOnly: true
        request_id:
          type: string
          readOnly: true
        metadata:
          readOnly: true
      required:
      - action
      - actor_label
      - created_at
      - customer
      - customer_code
      - id
      - metadata
      - outcome
      - request_id
      - target_id
      - target_type
    AuthSourceEnum:
      enum:
      - local
      - oidc
      type: string
      description: |-
        * `local` - Local (bootstrap/dev only)
        * `oidc` - OIDC (Microsoft Entra ID)
    Customer:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          maxLength: 32
        name:
          type: string
          maxLength: 200
        status:
          $ref: '#/components/schemas/CustomerStatusEnum'
        data_region:
          type: string
          description: Approved data residency region.
          maxLength: 64
        restricted_data:
          type: boolean
          description: 'Restricted/government data: ingestion requires a separately
            approved deployment (SECURITY.md §6).'
