components:
  schemas:
    Alias:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        product:
          type: string
          format: uuid
        name_pattern:
          type: string
          maxLength: 255
        publisher_pattern:
          type: string
          description: Exact publisher; blank = any.
          maxLength: 255
        match_type:
          $ref: '#/components/schemas/MatchTypeEnum'
        review_status:
          allOf:
          - $ref: '#/components/schemas/ReviewStatusEnum'
          readOnly: true
        created_by:
          type: string
          format: email
          readOnly: true
        reviewed_by:
          type: string
          format: email
          readOnly: true
        reviewed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - created_by
      - id
      - name_pattern
      - product
      - review_status
      - reviewed_at
      - reviewed_by
    ArchitectureEnum:
      enum:
      - any
      - x64
      - x86
      - arm64
      type: string
      description: |-
        * `any` - Any / not architecture-specific
        * `x64` - x64
        * `x86` - x86
        * `arm64` - ARM64
    AssetRow:
      type: object
      properties:
        id:
          type: string
          format: uuid
        external_id:
          type: string
        hostname:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 255
        device_type:
          type: string
          maxLength: 64
        group_name:
          type: string
          maxLength: 255
        site_external_id:
          type: string
          maxLength: 64
        site_name:
          type: string
          maxLength: 255
        group_external_id:
          type: string
          description: Blank = not in the device list.
          maxLength: 64
        organization_external_id:
          type: string
          maxLength: 64
        client_version:
          type: string
          maxLength: 64
        last_seen_online:
          type: string
          format: date-time
          nullable: true
        last_seen_stale:
          type: boolean
          nullable: true
          readOnly: true
        os_name:
          type: string
          maxLength: 255
        os_version:
          type: string
          maxLength: 64
        manufacturer:
          type: string
          maxLength: 255
        model:
          type: string
          maxLength: 255
        serial_number:
          type: string
          maxLength: 255
        domain:
          type: string
          maxLength: 255
        tags: {}
        software_status:
          $ref: '#/components/schemas/SoftwareStatusEnum'
        software_count:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        active:
          type: boolean
        source:
          type: string
        data_basis:
          type: string
        generation_id:
          type: string
          format: uuid
        as_of:
          type: string
          format: date-time
      required:
      - active
      - as_of
      - data_basis
      - external_id
      - generation_id
      - id
      - last_seen_stale
      - organization_external_id
      - software_status
      - source
    AuditEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        actor_label:
          type: string
          readOnly: true
          description: Actor email/system name at event time.
        action:
          type: string
          readOnly: true
        customer:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        customer_code:
          type: string
          readOnly: true
        target_type:
          type: string
          readOnly: true
        target_id:
          type: string
          readOnly: true
        outcome:
          allOf:
          - $ref: '#/components/schemas/OutcomeEnum'
          readOnly: true
        request_id:
          type: string
          readOnly: true
        metadata:
          readOnly: true
      required:
      - action
      - actor_label
      - created_at
      - customer
      - customer_code
      - id
      - metadata
      - outcome
      - request_id
      - target_id
      - target_type
    AuthSourceEnum:
      enum:
      - local
      - oidc
      type: string
      description: |-
        * `local` - Local (bootstrap/dev only)
        * `oidc` - OIDC (Microsoft Entra ID)
    ConfidenceEnum:
      enum:
      - official
      - secondary
      type: string
      description: |-
        * `official` - Vendor lifecycle page / official announcement
        * `secondary` - Secondary source (not used to classify)
    Connect:
      type: object
      description: Connect VSA wizard input. The token values are write-only and never
        echoed, logged or audited.
      properties:
        base_url:
          type: string
          maxLength: 500
        token_id:
          type: string
          writeOnly: true
          maxLength: 200
        token_secret:
          type: string
          writeOnly: true
          maxLength: 500
        name:
          type: string
          default: ''
          maxLength: 120
      required:
      - base_url
      - token_id
      - token_secret
    ConnectorHost:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        provider:
          $ref: '#/components/schemas/ProviderEnum'
        hostname:
          type: string
          maxLength: 253
        reason:
          type: string
          maxLength: 500
        added_by:
          type: string
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - added_by
      - created_at
      - hostname
      - id
      - provider
    Credential:
      type: object
      description: |-
        Write-only credential fields for the integration's provider (see ``GET /integrations/providers/``).

        All values are encrypted together; they are never echoed back, logged or audited.
      properties:
        fields:
          type: object
          additionalProperties:
            type: string
            maxLength: 1000
          writeOnly: true
      required:
      - fields
    CustomFieldAllowlist:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 120
        reason:
          type: string
          maxLength: 500
        state:
          allOf:
          - $ref: '#/components/schemas/ReviewedExpectationStateEnum'
          readOnly: true
        proposed_by:
          type: string
          format: email
          readOnly: true
        reviewed_by:
          type: string
          format: email
          readOnly: true
        reviewed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - proposed_by
      - reason
      - reviewed_at
      - reviewed_by
      - state
    Customer:
